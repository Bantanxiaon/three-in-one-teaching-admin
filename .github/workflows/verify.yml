name: Validate standalone admin
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: studio
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: studio_admin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studio -d studio_admin_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://studio:ci-only@127.0.0.1:5432/studio_admin_test
      AUTH_URL: http://127.0.0.1:3000
      AUTH_TRUST_HOST: "true"
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_TELEMETRY_DISABLED: "1"
      CONFIRM_DEMO_SEED: create-demo-in-empty-database
      ADMIN_SEED_EMAIL: admin@example.com
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"
          cache: npm
      - name: Generate ephemeral test credentials
        run: node scripts/ci-env.mjs
      - run: npm ci --no-fund
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Verify complete authentication flow
        run: node scripts/ci-auth-smoke.mjs
