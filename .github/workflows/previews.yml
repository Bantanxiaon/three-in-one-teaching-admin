name: Capture real system previews
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  previews:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: studio
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: studio_preview_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studio -d studio_preview_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://studio:ci-only@127.0.0.1:5432/studio_preview_test
      AUTH_URL: http://127.0.0.1:3000
      AUTH_TRUST_HOST: "true"
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_TELEMETRY_DISABLED: "1"
      CONFIRM_DEMO_SEED: create-demo-in-empty-database
      ADMIN_SEED_EMAIL: admin@example.com
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"
          cache: npm
      - run: node scripts/ci-env.mjs
      - run: npm ci --no-fund
      - run: npm run db:migrate
      - run: npm run db:seed
      - name: Add synthetic teaching data
        run: npx tsx scripts/seed-preview.ts
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Capture actual rendered pages
        run: node scripts/capture-previews.mjs
      - name: Upload screenshot evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: real-ui-previews
          path: ui-previews/
          retention-days: 7
